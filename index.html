<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Calendar Arderi" />
<title>Calendar Arderi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold-bg:#fffbea;--gold-border:#e6b800;
  --plat-bg:#f0f4f8;--plat-border:#9bb0c4;
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#fafaf9;
  --text:#1c1917;--text2:#78716c;--text3:#a8a29e;
  --border:#e7e5e4;--border2:#d6d3d1;
  --radius:10px;--radius-sm:6px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1917;--bg2:#292524;--bg3:#0c0a09;
    --text:#fafaf9;--text2:#a8a29e;--text3:#78716c;
    --border:#292524;--border2:#44403c;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;}

/* ── Login ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;}
#login-screen h1{font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:-.5px;}
#login-screen p{font-size:14px;color:var(--text2);margin-bottom:32px;}
.login-box{width:100%;max-width:340px;background:var(--bg);border:0.5px solid var(--border);border-radius:16px;padding:24px;}
.login-box label{font-size:12px;font-weight:500;color:var(--text2);display:block;margin-bottom:6px;}
.login-box input{width:100%;padding:11px 13px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;outline:none;margin-bottom:14px;}
.login-box input:focus{border-color:var(--text2);}
.login-btn{width:100%;padding:12px;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);font-size:15px;font-family:inherit;cursor:pointer;font-weight:500;}
.login-error{font-size:13px;color:#b71c1c;margin-top:10px;text-align:center;min-height:18px;}

/* ── App ── */
#app{display:none;max-width:480px;margin:0 auto;padding:16px 12px 80px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.top-bar h1{font-size:18px;font-weight:600;letter-spacing:-.3px;}
.view-tabs{display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:20px;}
.vtab{font-size:12px;padding:5px 14px;border-radius:16px;border:none;background:none;color:var(--text2);cursor:pointer;transition:all .15s;font-weight:500;}
.vtab.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:10px 12px;background:var(--bg2);border-radius:var(--radius);border:0.5px solid var(--border);}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.legend-dot{width:10px;height:10px;border-radius:2px;border:2px solid;flex-shrink:0;}
.ftag{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;}
.ftag.bisque{background:#fff3e0;color:#b26200;border:0.5px solid #f0a500;}
.ftag.glaze{background:#e8f5e9;color:#2e7d32;border:0.5px solid #4caf50;}
.ftag.gold-fire{background:#fffbea;color:#8a6800;border:0.5px solid #e6b800;}
.ftag.correction{background:#fce4ec;color:#b71c1c;border:0.5px solid #ef9a9a;}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.nav-btn{background:var(--bg2);border:0.5px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
.months-wrap{display:flex;flex-direction:column;gap:24px;}@media(min-width:700px){.months-wrap{flex-direction:row;}.month-block{flex:1;}}
.month-block{background:var(--bg);border-radius:var(--radius);border:0.5px solid var(--border);padding:12px;}
.month-block h2{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;text-align:center;letter-spacing:.02em;}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.weekdays span{font-size:10px;color:var(--text3);text-align:center;padding:2px 0;}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.day-cell{min-height:50px;border-radius:6px;padding:3px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:background .1s;}
.day-cell:hover{background:var(--bg2);}
.day-cell.today .day-num{background:var(--text);color:var(--bg);border-radius:50%;}
.day-num{font-size:16px;color:var(--text2);width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dots-row{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:1px;}
.dot{width:8px;height:8px;border-radius:2px;border:2px solid transparent;flex-shrink:0;}
.dot.gold{border-color:var(--gold-border);background:var(--gold-bg);}
.dot.platinum{border-color:var(--plat-border);background:var(--plat-bg);}
.dot.start{opacity:.5;}
.day-ftag{font-size:7px;padding:1px 2px;border-radius:2px;margin-top:1px;font-weight:600;white-space:nowrap;}
.day-ftag.bisque{background:#fff3e0;color:#b26200;}
.day-ftag.glaze{background:#e8f5e9;color:#2e7d32;}
.day-ftag.gold-fire{background:#fffbea;color:#8a6800;}
.day-ftag.correction{background:#fce4ec;color:#b71c1c;}
.bottom-btns{display:flex;gap:8px;margin-top:16px;}
.add-btn{flex:1;padding:11px;border-radius:var(--radius);border:0.5px dashed var(--border2);background:none;color:var(--text2);cursor:pointer;font-size:13px;font-family:inherit;transition:background .1s;}
.add-btn:hover{background:var(--bg2);}
.hist-filter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.hf-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;font-family:inherit;}
.hf-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.history-wrap{display:flex;flex-direction:column;gap:8px;}
.hist-card{border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--bg);transition:background .1s;}
.hist-card:hover{background:var(--bg2);}
.hist-card.gold-order{border-left:3px solid var(--gold-border);}
.hist-card.plat-order{border-left:3px solid var(--plat-border);}
.hist-thumb{width:44px;height:44px;border-radius:var(--radius-sm);flex-shrink:0;background:var(--bg2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px;}
.hist-thumb img{width:100%;height:100%;object-fit:cover;}
.hist-name{font-size:13px;font-weight:500;color:var(--text);}
.hist-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.hist-chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.chip{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--bg2);color:var(--text3);border:0.5px solid var(--border);}
.chip.done{background:#e8f5e9;color:#2e7d32;border-color:#4caf50;}
.chip.chip-active{background:#e3f2fd;color:#1565c0;border-color:#90caf9;}
.chip.overdue{background:#fce4ec;color:#b71c1c;border-color:#ef9a9a;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 16px;max-height:92vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);margin-top:-4px;line-height:1;}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px;}
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-bottom:14px;}
.photo-item{aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;border:0.5px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.photo-item img{width:100%;height:100%;object-fit:cover;}
.del-photo{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;}
.photo-item:hover .del-photo{display:flex;}
.upload-zone{border:0.5px dashed var(--border2);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;cursor:pointer;font-size:12px;color:var(--text3);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .1s;}
.upload-zone:hover{background:var(--bg2);}
.inst-box{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px;border:0.5px solid var(--border);}
.inst-box.empty{color:var(--text3);font-style:italic;}
.ocard{border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--bg);transition:background .1s;display:flex;gap:10px;align-items:flex-start;}
.ocard:hover{background:var(--bg2);}
.ocard.gold-order{border-left:3px solid var(--gold-border);}
.ocard.plat-order{border-left:3px solid var(--plat-border);}
.ocard-info{flex:1;min-width:0;}
.ocard-title{font-size:13px;font-weight:500;}
.ocard-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.ocard-chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.sc{padding:2px 7px;border-radius:10px;background:var(--bg2);color:var(--text2);border:0.5px solid var(--border);font-size:10px;}
.sc.done{background:#e8f5e9;color:#2e7d32;border-color:#4caf50;}
.form-group{margin-bottom:12px;}
.form-label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block;font-weight:500;}
.form-input{width:100%;padding:9px 11px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .1s;}
.form-input:focus{border-color:var(--text2);}
textarea.form-input{resize:vertical;min-height:72px;line-height:1.5;}
.radio-group{display:flex;gap:8px;}
.radio-opt{flex:1;text-align:center;font-size:13px;cursor:pointer;padding:9px 8px;border-radius:var(--radius);border:0.5px solid var(--border);transition:all .1s;font-family:inherit;}
.radio-opt.sel-gold{border-color:var(--gold-border);background:var(--gold-bg);color:#8a6800;}
.radio-opt.sel-plat{border-color:var(--plat-border);background:var(--plat-bg);color:#4a6070;}
.submit-btn{width:100%;padding:12px;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);font-size:14px;font-family:inherit;cursor:pointer;margin-top:6px;font-weight:500;}
.submit-btn:hover{opacity:.88;}
.danger-btn{width:100%;padding:10px;background:none;color:#b71c1c;border:0.5px solid #ef9a9a;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;margin-top:6px;}
.danger-btn:hover{background:#fce4ec;}
.edit-btn{background:none;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:5px 12px;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;}
.fire-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.fire-opt{padding:10px;border-radius:var(--radius);border:0.5px solid var(--border);text-align:center;cursor:pointer;font-size:13px;font-weight:500;transition:all .1s;font-family:inherit;background:var(--bg);}
.fire-opt:hover{background:var(--bg2);}
.fire-opt.sel-bisque{background:#fff3e0;color:#b26200;border-color:#f0a500;}
.fire-opt.sel-glaze{background:#e8f5e9;color:#2e7d32;border-color:#4caf50;}
.fire-opt.sel-gold-fire{background:#fffbea;color:#8a6800;border-color:#e6b800;}
.fire-opt.sel-correction{background:#fce4ec;color:#b71c1c;border-color:#ef9a9a;}
.order-check{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);border:0.5px solid var(--border);margin-bottom:6px;font-size:13px;background:var(--bg);}
.etsy-bar{display:flex;gap:8px;margin-bottom:8px;}
.etsy-bar input{flex:1;}
.etsy-btn{padding:9px 14px;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;font-weight:500;}
.etsy-btn:disabled{opacity:.45;cursor:default;}
.etsy-status{font-size:12px;min-height:16px;margin-bottom:10px;}
.divider{height:0.5px;background:var(--border);margin:14px 0;}
.fullimg-ov{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.fullimg-ov img{max-width:94vw;max-height:90vh;border-radius:8px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.loading{text-align:center;padding:3rem;color:var(--text3);font-size:14px;}
.firing-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--border);}
.firing-row-edit{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--border);gap:8px;}
.action-sheet{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.action-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg2);cursor:pointer;transition:background .1s;}
.action-card:hover{background:var(--border);}
.action-icon{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.action-label{font-size:14px;font-weight:500;}
.action-sub{font-size:12px;color:var(--text2);margin-top:1px;}
</style>
</head>
<body>

<div id="login-screen">
  <h1>🔥 Calendar</h1>
  <p>Enter your team password to continue</p>
  <div class="login-box">
    <label>Password</label>
    <input type="password" id="pw-input" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="login-btn" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="pw-error"></div>
  </div>
</div>

<div id="app">
  <div class="top-bar">
    <h1>🔥 Calendar</h1>
    <div class="view-tabs">
      <button class="vtab active" onclick="switchView('calendar')" id="tab-calendar">Calendar</button>
      <button class="vtab" onclick="switchView('history')" id="tab-history">History</button>
    </div>
  </div>

  <div id="view-calendar">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="border-color:var(--gold-border);background:var(--gold-bg)"></div>Gold</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:var(--plat-border);background:var(--plat-bg)"></div>Platinum</div>
      <div style="width:1px;height:12px;background:var(--border);margin:0 2px;"></div>
      <div class="legend-item"><span class="ftag bisque">B</span>Bisque</div>
      <div class="legend-item"><span class="ftag glaze">G</span>Glaze</div>
      <div class="legend-item"><span class="ftag gold-fire">Au</span>Gold/Plat</div>
      <div class="legend-item"><span class="ftag correction">C</span>Correction</div>
    </div>
    <div class="nav">
      <button class="nav-btn" onclick="shiftMonths(-1)">&#8249;</button>
      <span id="month-label" style="font-size:13px;color:var(--text2);font-weight:500;"></span>
      <button class="nav-btn" onclick="shiftMonths(1)">&#8250;</button>
    </div>
    <div class="months-wrap" id="months-wrap"><div class="loading">Loading orders…</div></div>
    <div class="bottom-btns">
      <button class="add-btn" onclick="openAddOrderModal()">+ New order</button>
      <button class="add-btn" onclick="openAddFiringModal()">+ Kiln</button>
    </div>
  </div>

  <div id="view-history" style="display:none;">
    <div class="hist-filter">
      <button class="hf-btn active" onclick="setFilter('all')" id="hf-all">All</button>
      <button class="hf-btn" onclick="setFilter('active')" id="hf-active">Active</button>
      <button class="hf-btn" onclick="setFilter('done')" id="hf-done">Completed</button>
      <button class="hf-btn" onclick="setFilter('gold')" id="hf-gold">Gold</button>
      <button class="hf-btn" onclick="setFilter('platinum')" id="hf-plat">Platinum</button>
    </div>
    <div class="history-wrap" id="history-wrap"><div class="loading">Loading…</div></div>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuKHvlwCCwp-R8vwjwG3y4lBa4Ui8GhjM",
  authDomain: "calendar-arderi.firebaseapp.com",
  projectId: "calendar-arderi",
  storageBucket: "calendar-arderi.firebasestorage.app",
  messagingSenderId: "928635678896",
  appId: "1:928635678896:web:ec178ccfd39eae9b648b75"
};

const TEAM_PASSWORD = "roz";
const SESSION_KEY = "kiln_auth";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WDAYS=['Mo','Tu','We','Th','Fr','Sa','Su'];
let baseMonth=new Date().getMonth(), baseYear=new Date().getFullYear();
let histFilter='all', selectedType=null, selectedFire=null, pendingPhotos=[];
let orders=[], editingOrderId=null;

// ── Auth ──
window.doLogin=function(){
  const val=document.getElementById('pw-input').value;
  if(val===TEAM_PASSWORD){
    sessionStorage.setItem(SESSION_KEY,'1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    startApp();
  } else {
    document.getElementById('pw-error').textContent='Wrong password. Try again.';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
};

if(sessionStorage.getItem(SESSION_KEY)==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  startApp();
}

function startApp(){
  const q=query(collection(db,'orders'),orderBy('start','desc'));
  onSnapshot(q,snap=>{
    orders=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderCalendar();
    if(document.getElementById('view-history').style.display!=='none') renderHistory();
  });
}

function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x;}
function today(){return fmtDate(new Date());}
function parseD(s){return new Date(s+'T12:00:00');}
function fmtDisp(s){const d=parseD(s);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getFullYear();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function saveOrder(data){await addDoc(collection(db,'orders'),data);}
async function updateOrder(id,data){await updateDoc(doc(db,'orders',id),data);}
async function removeOrder(id){await deleteDoc(doc(db,'orders',id));}
async function uploadPhoto(file){
  const ext=file.name.split('.').pop();
  const path=`photos/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const sRef=ref(storage,path);
  await uploadBytes(sRef,file);
  return await getDownloadURL(sRef);
}

// ── Views ──
window.switchView=function(v){
  document.getElementById('view-calendar').style.display=v==='calendar'?'':'none';
  document.getElementById('view-history').style.display=v==='history'?'':'none';
  document.getElementById('tab-calendar').classList.toggle('active',v==='calendar');
  document.getElementById('tab-history').classList.toggle('active',v==='history');
  if(v==='history') renderHistory();
};

window.setFilter=function(f){
  histFilter=f;
  ['all','active','done','gold','plat'].forEach(x=>{const el=document.getElementById('hf-'+x);if(el)el.classList.remove('active');});
  document.getElementById('hf-'+f).classList.add('active');
  renderHistory();
};

function renderHistory(){
  let list=[...orders];
  if(histFilter==='active') list=list.filter(o=>!o.completed);
  else if(histFilter==='done') list=list.filter(o=>o.completed);
  else if(histFilter==='gold') list=list.filter(o=>o.type==='gold');
  else if(histFilter==='platinum') list=list.filter(o=>o.type==='platinum');
  const wrap=document.getElementById('history-wrap');
  if(!list.length){wrap.innerHTML='<div class="loading">No orders found.</div>';return;}
  wrap.innerHTML=list.map(o=>{
    const fd=Object.values(o.firings||{});
    const prog=['bisque','glaze','gold-fire'].map(f=>`<span class="chip${fd.includes(f)?' done':''}">${f==='gold-fire'?'Au':f.charAt(0).toUpperCase()}</span>`).join('');
    const sl=o.completed?'<span class="chip done">Done</span>':parseD(o.deadline)<new Date()?'<span class="chip overdue">Overdue</span>':'<span class="chip chip-active">Active</span>';
    const thumb=o.photos&&o.photos.length?`<div class="hist-thumb"><img src="${o.photos[0]}" onerror="this.parentNode.innerHTML='🐾'" /></div>`:`<div class="hist-thumb">🐾</div>`;
    return `<div class="hist-card ${o.type}-order" onclick="openOrderDetail('${o.id}')">
      ${thumb}
      <div style="flex:1;min-width:0;">
        <div class="hist-name">${esc(o.name)}</div>
        <div class="hist-meta">${esc(o.customer)} · ${fmtDisp(o.start)} → ${fmtDisp(o.deadline)}</div>
        <div class="hist-chips">${sl}${prog}</div>
      </div>
    </div>`;
  }).join('');
}

// ── Calendar ──
window.shiftMonths=function(d){
  baseMonth+=d;
  if(baseMonth>11){baseMonth=0;baseYear++;}
  if(baseMonth<0){baseMonth=11;baseYear--;}
  renderCalendar();
};

function renderCalendar(){
  const m1=baseMonth,y1=baseYear,m2=m1===11?0:m1+1,y2=m1===11?y1+1:y1;
  document.getElementById('month-label').textContent=MONTHS[m1]+' – '+MONTHS[m2];
  document.getElementById('months-wrap').innerHTML=renderMonth(y1,m1)+renderMonth(y2,m2);
}

function renderMonth(year,month){
  const dim=new Date(year,month+1,0).getDate();
  let fdow=new Date(year,month,1).getDay();fdow=fdow===0?6:fdow-1;
  let cells='';
  for(let i=0;i<fdow;i++) cells+='<div class="day-cell" style="cursor:default;pointer-events:none;"></div>';
  for(let d=1;d<=dim;d++){
    const ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=ds===today();
    const oS=orders.filter(o=>o.start===ds),oD=orders.filter(o=>o.deadline===ds);
    const firings={};
    orders.forEach(o=>{if(o.firings&&o.firings[ds]){if(!firings[o.firings[ds]])firings[o.firings[ds]]=0;firings[o.firings[ds]]++;}});
    let dots='';
    oS.forEach(o=>{dots+=`<div class="dot ${o.type} start"></div>`;});
    oD.forEach(o=>{dots+=`<div class="dot ${o.type}"></div>`;});
    let ftags='';
    Object.keys(firings).forEach(t=>{const lb={bisque:'B',glaze:'G','gold-fire':'Au',correction:'C'};ftags+=`<div class="day-ftag ${t}">${lb[t]}</div>`;});
    cells+=`<div class="day-cell${isToday?' today':''}" onclick="openDayModal('${ds}')"><span class="day-num">${d}</span><div class="dots-row">${dots}</div>${ftags}</div>`;
  }
  return `<div class="month-block"><h2>${MONTHS[month].toUpperCase()} ${year}</h2><div class="weekdays">${WDAYS.map(w=>`<span>${w}</span>`).join('')}</div><div class="days-grid">${cells}</div></div>`;
}

window.saveEditFiring=async function(ds){

  const btn=document.getElementById('ef-submit-btn');btn.textContent='Saving…';btn.disabled=true;
  try{
    await Promise.all(orders.filter(o=>!o.completed).map(o=>{
      const f={...(o.firings||{})};
      if(checked.has(o.id)){f[ds]=selectedFire;}
      else{delete f[ds];}
      return updateOrder(o.id,{firings:f});
    }));
    closeModal();toast('Firing updated!');
  }catch(e){btn.textContent='Save changes';btn.disabled=false;alert('Error: '+e.message);}

window.deleteFiring=async function(ds){
  if(!confirm('Remove this kiln from all orders?'))return;
  try{

      return updateOrder(o.id,{firings:f});

window.importEtsy=async function(){
  const url=document.getElementById('etsy-url').value.trim();
  if(!url){setEtsyStatus('Please paste an Etsy URL.','error');return;}
  const btn=document.getElementById('etsy-btn');btn.disabled=true;btn.textContent='…';
  setEtsyStatus('Fetching listing…','');
  try{
    const resp=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url));
    const data=await resp.json();
    const html=data.contents||'';
    const titleMatch=html.match(/<title[^>]*>([^<]+)<\/title>/i);
    const raw=titleMatch?titleMatch[1].replace(/\s*[\|\-].*$/,'').replace(/\s+on Etsy.*/i,'').trim():'';
    const ogImg=html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i);
    const desc=html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']+)["']/i);
    if(raw){
      document.getElementById('f-name').value=raw;
      if(desc) document.getElementById('f-instructions').value=desc[1].trim().slice(0,300);
      if(ogImg){pendingPhotos=[ogImg[1]];renderPendingPhotos('add-photo-grid','add-file-input',false);}
      setEtsyStatus('Imported! Please review and adjust.','success');
    } else {setEtsyStatus('Could not parse listing. Fill manually.','error');}
  }catch(e){setEtsyStatus('Could not reach Etsy. Fill manually.','error');}
  btn.disabled=false;btn.textContent='Import';
};

function setEtsyStatus(msg,type){
  const el=document.getElementById('etsy-status');if(!el)return;
  el.textContent=msg;el.style.color=type==='error'?'#b71c1c':type==='success'?'#2e7d32':'var(--text2)';
}

// ── Photo helpers ──
function renderPendingPhotos(gridId,inputId,isEdit){
  const grid=document.getElementById(gridId);if(!grid)return;
  let html=pendingPhotos.map((p,i)=>{
    const src=typeof p==='string'?p:p.preview;
    return `<div class="photo-item"><img src="${src}" onerror="this.parentNode.innerHTML='🐾'" /><button class="del-photo" onclick="removePendingPhoto(${i},'${gridId}','${inputId}',${isEdit})">×</button></div>`;
  }).join('');
  html+=`<div class="upload-zone" onclick="document.getElementById('${inputId}').click()"><div style="font-size:20px;">+</div><div style="font-size:11px;">Upload</div></div>`;
  html+=`<input type="file" id="${inputId}" accept="image/*" multiple style="display:none;" onchange="handleFileInput(this,'${gridId}','${inputId}',${isEdit})" />`;
  grid.innerHTML=html;
}

window.removePendingPhoto=function(i,gridId,inputId,isEdit){pendingPhotos.splice(i,1);renderPendingPhotos(gridId,inputId,isEdit);};
window.handleFileInput=function(inp,gridId,inputId,isEdit){
  [...inp.files].forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{pendingPhotos.push({file:f,preview:e.target.result});renderPendingPhotos(gridId,inputId,isEdit);};
    r.readAsDataURL(f);
  });
};

async function uploadPendingFiles(){
  const urls=[];
  for(const p of pendingPhotos){
    if(typeof p==='string'){urls.push(p);}
    else if(p.file){try{urls.push(await uploadPhoto(p.file));}catch(e){console.error(e);}}
  }
  return urls;
}

window.selType=function(t,idA,idB){
  selectedType=t;
  const a=document.getElementById(idA),b=document.getElementById(idB);
  if(a)a.className='radio-opt'+(t==='gold'?' sel-gold':'');
  if(b)b.className='radio-opt'+(t==='platinum'?' sel-plat':'');
};

window.selFire=function(t){
  selectedFire=t;
  ['bisque','glaze','gold-fire','correction'].forEach(f=>{
    const el=document.getElementById('fo-'+f);
    if(el)el.className='fire-opt'+(f===t?' sel-'+f:'');
  });
};

window.openFullImg=function(src){
  const ov=document.createElement('div');ov.className='fullimg-ov';
  ov.innerHTML=`<img src="${src}" />`;ov.onclick=()=>ov.remove();
  document.body.appendChild(ov);
};

function showModal(content){
  document.getElementById('modal-root').innerHTML=`<div class="modal-overlay" id="moverlay" onclick="overlayClose(event)"><div class="modal"><div class="modal-handle"></div><button class="modal-close" onclick="closeModal()">×</button>${content}</div></div>`;
}
window.overlayClose=function(e){if(e.target.id==='moverlay')closeModal();};
window.closeModal=function(){document.getElementById('modal-root').innerHTML='';};
</script>
